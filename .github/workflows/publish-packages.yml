name: Publish packages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Pack only or publish to nuget.org"
        required: true
        default: pack
        type: choice
        options:
          - pack
          - publish
      package:
        description: "Package or package group to process"
        required: true
        default: all
        type: choice
        options:
          - all
          - Okojo.Annotations
          - Okojo.SourceGenerator
          - Okojo.DocGenerator.Annotations
          - Okojo.DocGenerator.Cli
          - Okojo.JavaScript
          - Okojo.JavaScript.Embedding
          - Okojo.Numerics
          - Okojo.Text.Unicode
          - Okojo.Text.RegularExpressions
          - Okojo.Globalization
          - Okojo.DotNet.Modules
          - Okojo.Hosting
          - Okojo.Diagnostics
          - Okojo.Reflection
          - Okojo.WebPlatform
          - Okojo.WebAssembly
          - Okojo.WebAssembly.Wasmtime

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Select packages
        id: select
        shell: pwsh
        run: |
          $selected = "${{ inputs.package }}"
          $repoRoot = $PWD.Path
          $sourceRoot = Join-Path $repoRoot 'src'

          # Discover every packable project so the publish set cannot drift from src/.
          $all = @(
            Get-ChildItem -LiteralPath $sourceRoot -Recurse -File -Filter '*.csproj' |
              ForEach-Object {
                [xml]$projectFile = Get-Content -LiteralPath $_.FullName -Raw
                $propertyGroups = @($projectFile.Project.PropertyGroup)
                $isPackable = @($propertyGroups | ForEach-Object { $_.IsPackable }) -contains 'true'
                $packageId = @($propertyGroups | ForEach-Object { $_.PackageId }) |
                  Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
                  Select-Object -First 1
                if ($isPackable -and $packageId) {
                  [pscustomobject]@{
                    Id = [string]$packageId
                    Project = [IO.Path]::GetRelativePath($repoRoot, $_.FullName)
                  }
                }
              }
          ) | Sort-Object Id

          if ($selected -eq "all") {
            $packages = @($all)
          } else {
            $packages = @($all | Where-Object { $_.Id -eq $selected })
          }

          if ($packages.Count -eq 0) {
            throw "No packages selected. Available: $($all.Id -join ', ')"
          }

          $json = $packages | ConvertTo-Json -Compress
          "packages=$json" >> $env:GITHUB_OUTPUT

      - name: Pack selected packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $packages = '${{ steps.select.outputs.packages }}' | ConvertFrom-Json
          foreach ($package in @($packages)) {
            Write-Host "Packing $($package.Id) from $($package.Project)"
            dotnet pack $package.Project -c Release -o artifacts /p:ContinuousIntegrationBuild=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    if: ${{ inputs.mode == 'publish' }}
    needs: pack
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        shell: pwsh
        run: |
          $packages = Get-ChildItem artifacts -Filter *.nupkg | Sort-Object Name
          if ($packages.Count -eq 0) {
            throw "No packages found to publish."
          }

          foreach ($package in $packages) {
            Write-Host "Publishing $($package.Name)"
            dotnet nuget push $package.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
