name: Publish packages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Pack only or publish to nuget.org"
        required: true
        default: pack
        type: choice
        options:
          - pack
          - publish
      package:
        description: "Package ids to process (comma/space separated), or 'all'"
        required: true
        default: all
        type: string

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Select packages
        id: select
        shell: pwsh
        env:
          PACKAGE_SELECTION: ${{ inputs.package }}
        run: |
          $selectedRaw = $env:PACKAGE_SELECTION
          $repoRoot = $PWD.Path
          $sourceRoot = Join-Path $repoRoot 'src'

          # Discover every packable project so the publish set cannot drift from src/.
          $all = @(
            Get-ChildItem -LiteralPath $sourceRoot -Recurse -File -Filter '*.csproj' |
              ForEach-Object {
                [xml]$projectFile = Get-Content -LiteralPath $_.FullName -Raw
                $propertyGroups = @($projectFile.Project.PropertyGroup)
                $isPackable = @($propertyGroups | ForEach-Object { $_.IsPackable }) -contains 'true'
                $packageId = @($propertyGroups | ForEach-Object { $_.PackageId }) |
                  Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
                  Select-Object -First 1
                if ($isPackable -and $packageId) {
                  [pscustomobject]@{
                    Id = [string]$packageId
                    Project = [IO.Path]::GetRelativePath($repoRoot, $_.FullName)
                  }
                }
              }
          ) | Sort-Object Id

          # Pack/publish in dependency order so newly published dependency ranges stay resolvable.
          $dependencyRank = @{
            'Okojo.Annotations'              = 0
            'Okojo.DocGenerator.Annotations' = 0
            'Okojo.Numerics'                 = 0
            'Okojo.Text.Unicode'             = 0
            'Okojo.Text.RegularExpressions'  = 0
            'Okojo.Globalization'            = 0
            'Okojo.JavaScript'               = 1
            'Okojo.SourceGenerator'          = 2
            'Okojo.DocGenerator.Cli'         = 2
            'Okojo.Diagnostics'              = 2
            'Okojo.JavaScript.Embedding'     = 2
            'Okojo.Hosting'                  = 3
            'Okojo.Reflection'               = 3
            'Okojo.WebAssembly'              = 3
            'Okojo.WebPlatform'              = 4
            'Okojo.DotNet.Modules'           = 4
            'Okojo.WebAssembly.Wasmtime'     = 4
          }

          if ($selectedRaw.Trim() -eq 'all') {
            $selected = @($all.Id)
          } else {
            $selected = @($selectedRaw -split '[,\s]+' | Where-Object { $_ } | Select-Object -Unique)
            $unknown = @($selected | Where-Object { $_ -notin $all.Id })
            if ($unknown.Count -gt 0) {
              throw "Unknown package(s): $($unknown -join ', '). Available: $($all.Id -join ', ')"
            }
          }

          $packages = @(
            $all |
              Where-Object { $_.Id -in $selected } |
              Sort-Object -Property @{
                Expression = {
                  if ($dependencyRank.ContainsKey($_.Id)) { $dependencyRank[$_.Id] } else { [int]::MaxValue }
                }
              }, 'Id'
          )

          if ($packages.Count -eq 0) {
            throw "No packages selected. Available: $($all.Id -join ', ')"
          }

          $json = $packages | ConvertTo-Json -Compress
          "packages=$json" >> $env:GITHUB_OUTPUT

      - name: Pack selected packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $packages = '${{ steps.select.outputs.packages }}' | ConvertFrom-Json
          foreach ($package in @($packages)) {
            Write-Host "Packing $($package.Id) from $($package.Project)"
            dotnet pack $package.Project -c Release -o artifacts /p:ContinuousIntegrationBuild=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    if: ${{ inputs.mode == 'publish' }}
    needs: pack
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        shell: pwsh
        run: |
          $packages = Get-ChildItem artifacts -Filter *.nupkg | Sort-Object Name
          if ($packages.Count -eq 0) {
            throw "No packages found to publish."
          }

          foreach ($package in $packages) {
            Write-Host "Publishing $($package.Name)"
            dotnet nuget push $package.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
